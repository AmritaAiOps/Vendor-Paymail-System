# Reverse proxy: serves the built frontend and proxies /api to the app. Owner: Person A.
# Included inside nginx's http block (conf.d), so zones and log formats can be declared here.

# One JSON line per request. $uri has no query string: filters can carry vendor names.
log_format json escape=json '{"time":"$time_iso8601","request_id":"$request_id","remote":"$remote_addr",'
                            '"method":"$request_method","uri":"$uri","status":$status,'
                            '"bytes":$body_bytes_sent,"duration":$request_time}';

# Uploads parse whole workbooks: 10 a minute per client address, bursts of 5. Everything else is unlimited.
# shortcut: keyed on the client address, so an office behind one NAT shares the budget; fine for a handful of users.
limit_req_zone $binary_remote_addr zone=uploads:10m rate=10r/m;
limit_req_status 429;

# shortcut: plain HTTP for the internal network. Add a TLS server block (or terminate TLS in front) before Firebase
# login goes live, since ID tokens must not cross the network in clear text.
server {
    listen 80;
    server_tokens off;
    access_log /dev/stdout json;
    client_max_body_size 1m;  # raised only on the upload routes below

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    # Inline styles: Tailwind output and the rendered email preview (sandboxed srcdoc iframe).
    # Firebase login will need its domains added to connect-src / frame-src.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # X-Request-ID shows up in the app's error log and its 500 reply, so one id ties both logs together
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;  # reconcile and run-now can take a while on a full month

    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;  # client-side routes
    }

    location /api/ {
        proxy_pass http://app:8000;
    }

    # 5 files of MAX_UPLOAD_MB (20) each, plus multipart overhead. Change together with MAX_UPLOAD_MB.
    location = /api/batches {
        limit_req zone=uploads burst=5 nodelay;
        client_max_body_size 105m;
        proxy_pass http://app:8000;
    }

    location = /api/manual-review/gdn-upload {
        limit_req zone=uploads burst=5 nodelay;
        client_max_body_size 21m;
        proxy_pass http://app:8000;
    }
}
