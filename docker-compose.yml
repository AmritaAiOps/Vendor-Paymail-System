services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: paymail
      POSTGRES_USER: paymail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paymail -d paymail"]
      interval: 5s
      retries: 10

  app:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://paymail:${POSTGRES_PASSWORD:-change-me}@db:5432/paymail
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
